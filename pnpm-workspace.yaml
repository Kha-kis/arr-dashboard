packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - '@prisma/engines'
  - argon2
  - better-sqlite3
  - esbuild
  - prisma
  - sharp
  - unrs-resolver

# Delay new releases for one week and reject packages whose provenance
# degrades or which introduce dependencies from non-registry sources.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true

# Fail installation if the version-scoped security backport stops applying.
allowUnusedPatches: false
ignorePatchFailures: false
patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
