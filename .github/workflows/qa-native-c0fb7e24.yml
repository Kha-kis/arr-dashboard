{
  "name": "Nonstable native ARM64 c0fb7e24 qualification",
  "on": {
    "push": {
      "branches": [
        "qa/225-native-arm64-c0fb7e24"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "packages": "write"
  },
  "jobs": {
    "qualify": {
      "runs-on": "ubuntu-24.04-arm",
      "timeout-minutes": 45,
      "env": {
        "CANDIDATE": "c0fb7e244be7c5cd1c116bc8b369c5258e88f28e"
      },
      "steps": [
        {
          "name": "Check out exact source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "c0fb7e244be7c5cd1c116bc8b369c5258e88f28e",
            "persist-credentials": false
          }
        },
        {
          "name": "Set up Buildx",
          "uses": "docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069"
        },
        {
          "name": "Log in to Docker Hub",
          "uses": "docker/login-action@dbcb813823bdd20940b903addbd779551569679f",
          "with": {
            "username": "${{ secrets.DOCKERHUB_USERNAME }}",
            "password": "${{ secrets.DOCKERHUB_TOKEN }}"
          }
        },
        {
          "name": "Log in to GHCR",
          "uses": "docker/login-action@dbcb813823bdd20940b903addbd779551569679f",
          "with": {
            "registry": "ghcr.io",
            "username": "${{ github.actor }}",
            "password": "${{ secrets.GITHUB_TOKEN }}"
          }
        },
        {
          "name": "Assert native source",
          "run": "test \"$(uname -m)\" = aarch64\ntest \"$(git rev-parse HEAD)\" = \"$CANDIDATE\"\ntest -z \"$(git status --porcelain)\""
        },
        {
          "name": "Build and stage nonstable ARM64 image",
          "id": "build",
          "uses": "docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc",
          "with": {
            "context": ".",
            "platforms": "linux/arm64",
            "push": true,
            "provenance": true,
            "sbom": true,
            "tags": "khak1s/arr-dashboard:qa-c0fb7e24-arm64\nghcr.io/kha-kis/arr-dashboard:qa-c0fb7e24-arm64",
            "build-args": "VERSION=2.25.0\nCOMMIT_SHA=c0fb7e244be7c5cd1c116bc8b369c5258e88f28e",
            "cache-from": "type=registry,ref=khak1s/arr-dashboard:buildcache-linux-arm64"
          }
        },
        {
          "name": "Qualify exact native artifact",
          "shell": "bash",
          "run": "set -euo pipefail\nmkdir -p receipts\ntest \"$(uname -m)\" = aarch64\ntest \"$(git rev-parse HEAD)\" = \"$CANDIDATE\"\ntest -z \"$(git status --porcelain --untracked-files=no)\"\ndigest='${{ steps.build.outputs.digest }}'\n[[ \"$digest\" =~ ^sha256:[0-9a-f]{64}$ ]]\nimage=\"ghcr.io/kha-kis/arr-dashboard@$digest\"\ndocker pull --platform linux/arm64 \"$image\"\nconfig=\"$(docker image inspect --format '{{.Id}}' \"$image\")\"\ntest \"$(docker image inspect --format '{{.Architecture}}' \"$image\")\" = arm64\ntest \"$(docker image inspect --format '{{index .Config.Labels \"org.opencontainers.image.revision\"}}' \"$image\")\" = \"$CANDIDATE\"\ndocker buildx imagetools inspect --raw \"$image\" > receipts/arm64-index.json\ndocker buildx imagetools inspect \"$image\" --format '{{json .Provenance}}' > receipts/provenance.json\ndocker buildx imagetools inspect \"$image\" --format '{{json .SBOM}}' > receipts/sbom.json\njq -e 'any(.manifests[]; .platform.architecture == \"arm64\") and any(.manifests[]; .annotations[\"vnd.docker.reference.type\"] == \"attestation-manifest\")' receipts/arm64-index.json\ncid=; pg=; network=\"qual-$GITHUB_RUN_ID\"\ncleanup() {\n  for id in $(docker ps -aq --filter \"label=arr-qualification=$GITHUB_RUN_ID\"); do docker rm -fv \"$id\" >/dev/null || :; done\n  docker network rm \"$network\" >/dev/null 2>&1 || :\n}\ntrap cleanup EXIT\ndocker network create --internal \"$network\"\nwait_ready() {\n  local expected=\"$1\" ok=0\n  for attempt in {1..180}; do\n    if docker exec \"$cid\" node -e 'Promise.all([fetch(\"http://127.0.0.1:3001/health\",{signal:AbortSignal.timeout(2000)}).then(async r=>{const v=await r.json();return r.ok&&v.status===\"ok\"&&(!process.argv[1]||v.commit===process.argv[1]);}),fetch(\"http://127.0.0.1:3000/login\",{signal:AbortSignal.timeout(2000)}).then(r=>r.ok)]).then(v=>process.exit(v.every(Boolean)?0:1)).catch(()=>process.exit(1))' \"$expected\" >/dev/null 2>&1; then ok=1; break; fi\n    test \"$(docker inspect --format '{{.State.Running}}' \"$cid\")\" = true || break\n    sleep 1\n  done\n  if test \"$ok\" != 1; then docker logs \"$cid\"; return 1; fi\n  test \"$(docker inspect --format '{{.RestartCount}} {{.State.OOMKilled}}' \"$cid\")\" = '0 false'\n}\nstop_clean() {\n  docker stop --time 120 \"$cid\" >/dev/null\n  test \"$(docker inspect --format '{{.State.Status}} {{.State.ExitCode}} {{.State.OOMKilled}}' \"$cid\")\" = 'exited 0 false'\n  docker logs \"$cid\" > \"receipts/$1.log\" 2>&1\n  printf '%s PASS\\n' \"$1\" | tee -a receipts/lifecycle.txt\n  docker rm -v \"$cid\" >/dev/null\n  cid=\n}\n# Native default SQLite install with image-owned ephemeral /config.\ncid=\"$(docker run -d --label \"arr-qualification=$GITHUB_RUN_ID\" --network none \"$image\")\"\nwait_ready \"$CANDIDATE\"\nstop_clean sqlite-fresh-default\n# Native previous-stable SQLite install with remapped identity and persisted config.\ndocker pull --platform linux/arm64 khak1s/arr-dashboard:2.24.1\nprevious=\"$(docker image inspect --format '{{index .RepoDigests 0}}' khak1s/arr-dashboard:2.24.1)\"\ntest \"$(docker image inspect --format '{{.Architecture}}' \"$previous\")\" = arm64\nmkdir -p \"$RUNNER_TEMP/qual-sqlite\" \"$RUNNER_TEMP/qual-pg\"\ncid=\"$(docker run -d --label \"arr-qualification=$GITHUB_RUN_ID\" --network none -e PUID=1000 -e PGID=1000 -v \"$RUNNER_TEMP/qual-sqlite:/config\" \"$previous\")\"\nwait_ready ''\nstop_clean sqlite-previous-stable\nsudo python3 - \"$RUNNER_TEMP/qual-sqlite/prod.db\" <<'PY'\nimport sqlite3,sys\nc=sqlite3.connect(sys.argv[1]);c.execute('INSERT INTO User (id, username, updatedAt) VALUES (?,?,?)',('native-qualification-sentinel','qualification-fixture','2026-11-23T00:00:00Z'));c.commit();c.close()\nPY\nprintf qualification-fixture | sudo tee \"$RUNNER_TEMP/qual-sqlite/qualification-config.txt\" >/dev/null\ncid=\"$(docker run -d --label \"arr-qualification=$GITHUB_RUN_ID\" --network none -e PUID=1000 -e PGID=1000 -v \"$RUNNER_TEMP/qual-sqlite:/config\" \"$image\")\"\nwait_ready \"$CANDIDATE\"\nstop_clean sqlite-upgrade-stable-to-candidate\nsudo python3 - \"$RUNNER_TEMP/qual-sqlite/prod.db\" <<'PY'\nimport sqlite3,sys\nc=sqlite3.connect(sys.argv[1]);assert c.execute('SELECT username FROM User WHERE id=?',('native-qualification-sentinel',)).fetchone()==('qualification-fixture',);assert c.execute('PRAGMA integrity_check').fetchall()==[('ok',)];assert not c.execute('PRAGMA foreign_key_check').fetchall();c.close()\nPY\ntest \"$(cat \"$RUNNER_TEMP/qual-sqlite/qualification-config.txt\")\" = qualification-fixture\nprintf 'sqlite-user-config-conservation PASS\\n' >> receipts/lifecycle.txt\n# Disposable native PostgreSQL, no external database or provider targets.\npg=\"$(docker run -d --label \"arr-qualification=$GITHUB_RUN_ID\" --network \"$network\" --network-alias postgres -e POSTGRES_PASSWORD=qualification-only postgres:17-alpine)\"\nfor attempt in {1..90}; do docker exec \"$pg\" pg_isready -U postgres >/dev/null 2>&1 && break; sleep 1; done\ndocker exec \"$pg\" createdb -U postgres qualification_fresh\ndocker exec \"$pg\" createdb -U postgres qualification_upgrade\ncid=\"$(docker run -d --label \"arr-qualification=$GITHUB_RUN_ID\" --network \"$network\" -e PUID=1000 -e PGID=1000 -e DATABASE_URL=postgresql://postgres:qualification-only@postgres:5432/qualification_fresh \"$image\")\"\nwait_ready \"$CANDIDATE\"\nstop_clean postgresql-fresh\ncid=\"$(docker run -d --label \"arr-qualification=$GITHUB_RUN_ID\" --network \"$network\" -e PUID=1000 -e PGID=1000 -e DATABASE_URL=postgresql://postgres:qualification-only@postgres:5432/qualification_upgrade -v \"$RUNNER_TEMP/qual-pg:/config\" \"$previous\")\"\nwait_ready ''\nstop_clean postgresql-previous-stable\ndocker exec \"$pg\" psql -U postgres -d qualification_upgrade -v ON_ERROR_STOP=1 -c 'INSERT INTO \"User\" (id,username,\"updatedAt\") VALUES ('\"'\"'native-qualification-sentinel'\"'\"','\"'\"'qualification-fixture'\"'\"',CURRENT_TIMESTAMP)'\nprintf qualification-fixture | sudo tee \"$RUNNER_TEMP/qual-pg/qualification-config.txt\" >/dev/null\ncid=\"$(docker run -d --label \"arr-qualification=$GITHUB_RUN_ID\" --network \"$network\" -e PUID=1000 -e PGID=1000 -e DATABASE_URL=postgresql://postgres:qualification-only@postgres:5432/qualification_upgrade -v \"$RUNNER_TEMP/qual-pg:/config\" \"$image\")\"\nwait_ready \"$CANDIDATE\"\nstop_clean postgresql-upgrade-stable-to-candidate\ntest \"$(docker exec \"$pg\" psql -U postgres -d qualification_upgrade -Atc 'SELECT username FROM \"User\" WHERE id='\"'\"'native-qualification-sentinel'\"'\"'')\" = qualification-fixture\ntest \"$(cat \"$RUNNER_TEMP/qual-pg/qualification-config.txt\")\" = qualification-fixture\nprintf 'postgresql-user-config-conservation PASS\\n' >> receipts/lifecycle.txt\njq -n --arg source \"$CANDIDATE\" --arg digest \"$digest\" --arg config \"$config\" --arg previous \"$previous\" '{source:$source,platform:\"linux/arm64\",digest:$digest,config:$config,previousStable:$previous,native:true,freshSQLite:true,freshPostgresql:true,upgradeSQLite:true,upgradePostgresql:true,remappedPuidPgid:true,gracefulExit:true}' > receipts/runtime.json\n# Scan the exact pulled build config used for all native candidate tests.\ncurl -fsSL --max-time 90 https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-ARM64.tar.gz -o \"$RUNNER_TEMP/trivy.tgz\"\nprintf '%s  %s\\n' ab9d51f86e6a5fb936f605faff6b593ac51bc378fff4d3e8b9d58358b9c367c3 \"$RUNNER_TEMP/trivy.tgz\" | sha256sum --check --status\ntar -xzf \"$RUNNER_TEMP/trivy.tgz\" -C \"$RUNNER_TEMP\" trivy\n\"$RUNNER_TEMP/trivy\" --cache-dir \"$RUNNER_TEMP/trivy-cache\" image --image-src docker --platform linux/arm64 --scanners vuln --severity HIGH,CRITICAL --timeout 8m --format json --output receipts/scan.json \"$config\"\njq -e --arg image \"$config\" '.Metadata.ImageID == $image and any(.Results[]; .Class == \"os-pkgs\" and .Type == \"alpine\") and any(.Results[]; .Class == \"lang-pkgs\" and .Type == \"node-pkg\") and (.Metadata.OS.EOSL // false | not)' receipts/scan.json\ncount=\"$(jq '[.Results[] | .Vulnerabilities[]?] | length' receipts/scan.json)\"\njq -n --argjson count \"$count\" '{highCriticalFindings:$count}' > receipts/security.json\ncat receipts/runtime.json receipts/security.json >> \"$GITHUB_STEP_SUMMARY\"\ntest \"$count\" = 0\n"
        },
        {
          "name": "Upload native qualification receipts",
          "if": "always()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "native-arm64-c0fb7e24",
            "path": "receipts/",
            "if-no-files-found": "warn",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
