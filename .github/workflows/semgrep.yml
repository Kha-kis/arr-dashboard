name: Semgrep

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - "LICENSE"
      - ".gitignore"
  schedule:
    # Run weekly on Sundays at 5:00 UTC (offset from CodeQL)
    - cron: "0 5 * * 0"

permissions:
  security-events: write
  contents: read

jobs:
  scan:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history needed for baseline diff on PRs
          fetch-depth: 0

      - name: Run Semgrep
        run: >
          semgrep scan --config auto --sarif --output semgrep-results.sarif
          --exclude-rule javascript.express.security.audit.xss.direct-response-write.direct-response-write
          --exclude-rule javascript.lang.security.audit.detect-non-literal-regexp.detect-non-literal-regexp
        env:
          # Scan changed files on PRs, full repo on push/schedule
          SEMGREP_BASELINE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always()
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep
