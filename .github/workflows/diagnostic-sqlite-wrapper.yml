{
  "name": "Diagnostic only - native SQLite storage release wrapper",
  "on": {
    "push": {
      "branches": [
        "qa/sqlite-wrapper-ac523dbd"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "native-wrapper": {
      "runs-on": "${{ matrix.runner }}",
      "timeout-minutes": 25,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "runner": "ubuntu-latest",
              "arch": "amd64"
            },
            {
              "runner": "ubuntu-24.04-arm",
              "arch": "arm64"
            }
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 2
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "24"
          }
        },
        {
          "uses": "pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320",
          "with": {
            "version": "10.33.0"
          }
        },
        {
          "run": "pnpm install --frozen-lockfile"
        },
        {
          "run": "pnpm exec playwright install --with-deps chromium"
        },
        {
          "name": "Build from exact reviewed code (local diagnostic only)",
          "shell": "bash",
          "run": "test \"$(git rev-parse HEAD^)\" = \"ac523dbdb9f988307eb268ebbe16f4a114afdb1f\"\ngit archive \"ac523dbdb9f988307eb268ebbe16f4a114afdb1f\" | docker build --build-arg COMMIT_SHA=\"ac523dbdb9f988307eb268ebbe16f4a114afdb1f\" -t arr-dashboard:sqlite-wrapper-diagnostic -\ndocker image inspect arr-dashboard:sqlite-wrapper-diagnostic --format \"{{.Id}} {{.Architecture}}\""
        },
        {
          "name": "Run the app, browser and SQLite storage checks",
          "shell": "bash",
          "env": {
            "ARCH": "${{ matrix.arch }}",
            "SOURCE_SHA": "ac523dbdb9f988307eb268ebbe16f4a114afdb1f",
            "SOURCE_TREE": "152cef71e92429bf434ede0838083a115e187104",
            "RUN_ID": "${{ github.run_id }}",
            "VERSION": "2.25.1",
            "BUILD_DATE": "2026-11-25T03:00:00Z"
          },
          "run": "CANDIDATE_IMAGE=$(docker image inspect --format \"{{.Id}}\" arr-dashboard:sqlite-wrapper-diagnostic)\nexport CANDIDATE_IMAGE CONFIG_DIGEST=\"$CANDIDATE_IMAGE\" CANDIDATE_DIGEST=\"$CANDIDATE_IMAGE\" CANDIDATE_MANIFEST_DIGEST=\"$CANDIDATE_IMAGE\"\nCI=true bash scripts/release-native-verify.sh"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "if": "always()",
          "with": {
            "name": "sqlite-wrapper-diagnostic-${{ matrix.arch }}",
            "path": "${{ runner.temp }}/release/sqlite-storage.json\n${{ runner.temp }}/release/playwright.json",
            "if-no-files-found": "warn",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
