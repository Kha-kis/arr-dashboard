name: Promote Qualified Release Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable package version, without v'
        required: true
        type: string
      stage_run_id:
        description: 'Successful qualification workflow run ID'
        required: true
        type: string
      stage_run_attempt:
        description: 'Qualified run attempt'
        required: true
        type: string
      qualification_sha256:
        description: 'SHA-256 of release-qualification.json'
        required: true
        type: string
      index_digest:
        description: 'Qualified immutable multiarchitecture digest'
        required: true
        type: string
      expected_aliases:
        description: 'JSON previous minor, major and latest digests for both registries'
        required: true
        type: string

permissions: {}

concurrency:
  group: stable-release-registry-promotion
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  STAGE_RUN_ID: ${{ inputs.stage_run_id }}
  STAGE_RUN_ATTEMPT: ${{ inputs.stage_run_attempt }}
  QUALIFICATION_SHA256: ${{ inputs.qualification_sha256 }}
  QUALIFIED_INDEX_DIGEST: ${{ inputs.index_digest }}
  EXPECTED_ALIASES: ${{ inputs.expected_aliases }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'Kha-kis/arr-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify trusted stage, approved inputs and both registry graphs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/release_promotion.py preflight

  promote:
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: stable-release
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the recorded protected-environment approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/release_promotion.py authorize
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub for stable promotion
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.STABLE_DOCKERHUB_USERNAME }}
          password: ${{ secrets.STABLE_DOCKERHUB_TOKEN }}
      - name: Log in to GHCR for stable promotion
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Revalidate and copy only the qualified index
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/release_promotion.py promote
      - name: Update Docker Hub release description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.STABLE_DOCKERHUB_USERNAME }}
          password: ${{ secrets.STABLE_DOCKERHUB_TOKEN }}
          repository: khak1s/arr-dashboard
          short-description: ${{ github.event.repository.description }}
          readme-filepath: ./DOCKERHUB.md
