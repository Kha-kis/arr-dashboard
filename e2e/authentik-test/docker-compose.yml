# Docker Compose for real Authentik OIDC integration testing.
# Covers canonical issuer handling (#208) and the linked-admin lifecycle (#650).
#
# Usage:
#   pnpm e2e:authentik:up
#   pnpm e2e:authentik
#   pnpm e2e:authentik:down

services:
  postgresql:
    image: postgres:16-alpine
    container_name: authentik-test-db
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: testing-only-not-production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - authentik-net
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: authentik-test-redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - authentik-net

  authentik-server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION:-2026.5.6}
    container_name: authentik-test-server
    command: server
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: testing-only-not-production
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_SECRET_KEY: e2e-test-secret-key-not-for-production-use
      # Bootstrap admin account — no manual setup needed
      AUTHENTIK_BOOTSTRAP_PASSWORD: TestPassword123!
      AUTHENTIK_BOOTSTRAP_TOKEN: e2e-test-api-token
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@test.local
    ports:
      - "9000:9000"
      - "9443:9443"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - authentik-net

  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION:-2026.5.6}
    container_name: authentik-test-worker
    command: worker
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: testing-only-not-production
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_SECRET_KEY: e2e-test-secret-key-not-for-production-use
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - authentik-net

  arr-dashboard:
    build:
      context: ../../
      dockerfile: Dockerfile
      args:
        VERSION: e2e-authentik
        COMMIT_SHA: local
    container_name: authentik-test-dashboard
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
      - "${DASHBOARD_API_PORT:-3001}:3001"
    volumes:
      - dashboard-config:/config
    environment:
      PUID: 1000
      PGID: 1000
      PORT: 3000
      API_PORT: 3001
      DATABASE_URL: file:/config/prod.db
      APP_URL: http://localhost:${DASHBOARD_PORT:-3000}
      API_RATE_LIMIT_MAX: 10000
    depends_on:
      authentik-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - authentik-net

volumes:
  dashboard-config:

networks:
  authentik-net:
    driver: bridge
